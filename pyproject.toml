[project]
name = "fugaku-job-success-predictor"
version = "0.1.0"
description = "富岳ジョブ投入前の成功率をNNで予測するWebアプリ"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "torch>=2.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["src"]
